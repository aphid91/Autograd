# Publish the web viewer (web/) to GitHub Pages on every push to Web.
#
# One-time setup in the repo settings:
#   Settings > Pages > Source: "GitHub Actions"
#   Settings > Environments > github-pages > deployment branches: allow "Web"
name: pages

on:
  push:
    branches: [Web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Regenerate the type table from the Python classes, so a deploy can
      # never ship a types.json older than core/entity.py.
      - run: pip install numpy && python tools/export_web_types.py
      - run: bash web/build.sh _site
      # Named per attempt: artifacts belong to the whole run, so a re-run
      # would otherwise upload a second "github-pages" beside the first and
      # deploy-pages refuses to choose between them.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # deploy-pages looks the artifact up by name straight away, and GitHub's
      # artifact listing can lag the upload: it has failed with "No artifacts
      # named github-pages-N" while that artifact sat finalized in the run --
      # once with the lookup finding 0, once finding 1 but returning an empty
      # list. So wait a little first, and if it still fails, wait longer and
      # try once more.
      - run: sleep 15
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
