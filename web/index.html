<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Gates</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gates">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The phone shell, after Fluoddity's sand mode: the board, a row of
     controls, and the swatch bar. ui.js builds into these containers. -->
<div id="shell">
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="fps" hidden></div>
    <div id="pane-host"></div>
    <div class="thumbpad" id="thumb-left" data-show="false"></div>
    <div class="thumbpad" id="thumb-right" data-show="false"></div>
  </div>
  <div id="controls"></div>
  <footer id="bar">
    <div id="swrow">
      <button type="button" class="swarrow" id="sw-left" aria-label="Scroll tools left"></button>
      <div id="swatches"></div>
      <button type="button" class="swarrow" id="sw-right" aria-label="Scroll tools right"></button>
    </div>
    <div id="bar-hint">Tap a machine or belt to inspect it</div>
  </footer>
</div>

<div id="picker" data-open="false" role="dialog" aria-modal="true" aria-labelledby="picker-title">
  <div class="sheet">
    <div class="sheet-head">
      <span id="picker-title"></span>
      <button type="button" class="b sheet-btn" id="picker-cancel">Cancel</button>
    </div>
    <div id="picker-list"></div>
    <button type="button" class="b sheet-btn danger" id="picker-remove">Remove slot</button>
  </div>
</div>

<div id="bakemenu" class="sheetwrap" data-open="false" role="dialog" aria-modal="true" aria-labelledby="bake-title">
  <div class="sheet">
    <div class="sheet-head">
      <span id="bake-title">Bake audio</span>
      <button type="button" class="b sheet-btn" id="bake-close">Close</button>
    </div>
    <div class="idx-row">
      <label class="idx-ab">seconds <input id="bake-seconds" type="text" inputmode="decimal" autocomplete="off"></label>
      <label class="idx-ab">ticks/s <input id="bake-rate" type="text" inputmode="decimal" autocomplete="off"></label>
    </div>
    <div id="bake-status" class="idx-preview"></div>
    <div class="idx-row">
      <button type="button" class="b sheet-btn idx-apply" id="bake-go">Bake</button>
      <button type="button" class="b sheet-btn" id="bake-play">Play</button>
      <button type="button" class="b sheet-btn" id="bake-cancel">Cancel bake</button>
      <button type="button" class="b sheet-btn" id="bake-wav">Download WAV</button>
    </div>
  </div>
</div>

<div id="stampmenu" class="sheetwrap" data-open="false" role="dialog" aria-modal="true" aria-labelledby="stampmenu-title">
  <div class="sheet">
    <div class="sheet-head">
      <span id="stampmenu-title">Stamp</span>
      <button type="button" class="b sheet-btn" id="stampmenu-cancel">Cancel</button>
    </div>
    <div class="namerow">
      <input id="stampmenu-name" type="text" maxlength="24" autocomplete="off" spellcheck="false" aria-label="Stamp name">
      <button type="button" class="b sheet-btn" id="stampmenu-rename">Rename</button>
    </div>
    <button type="button" class="b sheet-btn danger" id="stampmenu-delete">Delete stamp</button>
  </div>
</div>

<div id="indexsheet" class="sheetwrap" data-open="false" role="dialog" aria-modal="true" aria-labelledby="indexsheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <span id="indexsheet-title">Index values</span>
      <button type="button" class="b sheet-btn" id="index-cancel">Cancel</button>
    </div>
    <div id="index-tables" class="idx-tables"></div>
    <div class="idx-row" id="index-extra"></div>
    <div class="idx-row">
      <label class="idx-ab">a · x <input id="index-a" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="1"></label>
      <label class="idx-ab">+ b <input id="index-b" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="0"></label>
    </div>
    <div id="index-preview" class="idx-preview"></div>
    <button type="button" class="b sheet-btn idx-apply" id="index-apply">Apply</button>
  </div>
</div>

<div id="notesheet" class="sheetwrap" data-open="false" role="dialog" aria-modal="true" aria-labelledby="notesheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <span id="notesheet-title">Label</span>
      <button type="button" class="b sheet-btn" id="note-done">Done</button>
    </div>
    <textarea id="note-text" rows="3" autocomplete="off" spellcheck="false" aria-label="Label text" placeholder="Label text"></textarea>
    <div class="idx-row">
      <div id="note-sizes" class="note-opts"></div>
      <div id="note-colours" class="note-opts"></div>
    </div>
    <button type="button" class="b sheet-btn danger" id="note-delete">Delete label</button>
  </div>
</div>

<input id="index-file" type="file" accept=".txt,.csv,text/plain,text/csv" hidden>
<input id="save-file" type="file" accept=".npz" hidden>
<script type="module" src="main.js"></script>
</body>
</html>
